<html lang="pt-BR">

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #111111;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 0 20px 56px;
      }
      .container {
        width: 100%;
        max-width: 480px;
        text-align: center;
      }
      .topo {
        width: 100%;
        height: auto;
        display: block;
        margin: 0 auto 32px;
      }
      h1 {
        margin-bottom: 24px;
      }
      .links {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .link {
        display: block;
        background: #ffffff;
        color: #111111;
        text-decoration: none;
        padding: 16px 20px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1rem;
        border: 1px solid #e5e5e5;
        transition:
          transform 0.12s ease,
          background 0.2s ease;
      }
      .link:hover {
        background: #f5f5f5;
        transform: translateY(-2px);
      }
      footer {
        margin-top: 40px;
        font-size: 0.8rem;
        color: #999999;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <img
        class="topo"
        src="public/rennoar_topo.jpeg"
        alt="Caio Rennó — Psicotropical"
      />

      <h1>RENNOAR — Psicotropical</h1>

      <nav class="links">

          rel="noopener"
          >Spotify</a

        <a
          class="link"
          href="https://www.youtube.com/playlist?list=OLAK5uy_m4o_sTfjuzElk8KoYnCUSsO6xRc5YacVg"
          data-link="YouTube"
          target="_blank"
          rel="noopener"
          >YouTube</a
        >
        <a
          class="link"
          href="https://music.apple.com/us/album/psicotropical/1891813184?at=11lqQE&ct=FFM_3bad623c106d3e8abb10f46544ada354&ls=1&uo=4"
          data-link="Apple Music"
          target="_blank"
          rel="noopener"
          >Apple Music</a
        >
        <a
          class="link"
          href="https://www.deezer.com/br/album/957357641"
          data-link="Deezer"
          target="_blank"
          rel="noopener"
          >Deezer</a
        >
        <a
          class="link"
          href="https://music.amazon.com/albums/B0GWKKJQM6?ref=dm_ff_amazonmusic_3p&tag=featurefmbr-20"
          data-link="Amazon Music"
          target="_blank"
          rel="noopener"
          >Amazon Music</a
        >
        <a
          class="link"
          href="https://tidal.com/album/514302646"
          data-link="Tidal"
          target="_blank"
          rel="noopener"
          >Tidal</a
        >
        <a
          class="link"

          data-link="TikTok"
          target="_blank"

          >TikTok</a
        >
        <a
          class="link"
          href="https://www.instagram.com/caiorenno"
          data-link="Instagram"
          target="_blank"
          rel="noopener"
          >Instagram</a
        >
      </nav>

      <footer>© 2026 Caio Rennó</footer>
    </main>

    <!-- Tracking de clique: dispara evento customizado por link -->
    <script>
      document.querySelectorAll(".link").forEach(function (el) {
        el.addEventListener("click", function () {
          if (window.fbq) {
            fbq("trackCustom", "ClickLink", { link: el.dataset.link });
          }
        });
      });
    </script>
  </body>
</html>
